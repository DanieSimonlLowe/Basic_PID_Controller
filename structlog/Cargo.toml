[package]
name = "structlog"
version = "0.1.0"
edition = "2021"
description = "Append-only, crash-tolerant file log of serde structs, readable back as an iterator"
license = "MIT OR Apache-2.0"

[dependencies]
serde = "1"
postcard = { version = "1", features = ["use-std"] }
crc32fast = "1"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
